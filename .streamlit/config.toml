# Do not send usage statistics. To keep the dashboard private on your own machine,
# start it with `--server.address localhost` (see README / Makefile). The address is
# not fixed here so the same app can also be deployed to Streamlit Community Cloud.
[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
